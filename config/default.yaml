device_file: null  # Relative to this config: devices/<设备名>.yaml; null uses estimated intrinsics.
inference:
  # Mac 实测选择；Windows 待测，可在 config/local.yaml 中覆盖以下设置。
  device: auto  # auto / cpu / cuda / mps; auto selects CUDA if available, otherwise CPU (Mac uses CPU).
  num_threads: 2  # PyTorch intraop only; legacy cpu_threads still accepted.
  max_fps: 15  # Python inference start-rate cap; null=unlimited. Overlay calibration/redo/check temporarily run uncapped.
  max_faces: 1
  blink_threshold: 0.14
  distance_min_m: 0.15
  distance_max_m: 1.5
  normalized_camera_distance_m: 0.6
click_session:
  max_fps: null  # Click experiment collection runs uncapped; restore inference.max_fps afterwards.
  recent_baseline_max_age_s: 300.0  # A matching Python nine-point profile younger than 5 minutes may be reused explicitly.
  clock_resample_ms: 10000.0
  clock_max_uncertainty_ms: 20.0  # Clock quality bound, not an experimental window or a precision claim.
  clock_max_drift_ms: 20.0
  clock_max_delay_ms: 10000.0
camera:
  index: 0
  width: 640
  height: 480
  backend: auto  # auto / dshow (DirectShow, Windows only)
  grayscale: false
  startup_timeout_s: 120.0
  stop_timeout_s: 5.0
  warmup_timeout_s: 3.0  # Retry failed reads until the first frame, up to this deadline.
  read_retry_interval_s: 0.05  # Interruptible wait between failed reads; no delay on success.
  read_retry_count: 3  # After the first valid frame: extra attempts after a failed read.
  black_threshold: 2.0  # Mean brightness on 0–255 scale.
  black_frame_count: 10  # Consecutive dark frames after exposure warmup.
  undistort: true
  undistort_alpha: 0.0  # OpenCV new-camera-matrix alpha; no ROI crop is applied.
geometry:
  width_cm: null  # Fill both measured dimensions, or select a measured device file.
  height_cm: null
  measured: false
  horizontal_cm: 0.0  # Positive to the viewer's right of the screen centre.
  top_cm: 0.0  # Positive ABOVE the top of the visible screen.
  focal_scale: 1.0
recording:
  output_dir: data/sessions
  queue_size: 2048
  close_timeout_s: 10.0
  request_timeout_s: 15.0
jump:
  point_count: 20
  dwell_ms: 1500.0
  min_distance: 0.35
  margin: 0.05  # Fraction of each screen dimension; target centers stay inside this inset.
calibration:
  views: 20
  max_error_px: 1.0  # Acceptance threshold, not a measured result.
  min_view_distance: 0.08
  min_center_span: 0.2
  min_tilt_span_deg: 15.0
  refine_window_px: 11
  refine_max_iterations: 30
  refine_epsilon: 0.001
distance_check:
  distances_cm: [40, 50, 60]
  settle_ms: 1000.0
  duration_ms: 3000.0
  min_samples: 20
  warning_cm: 5.0  # Warning threshold, not a measured result.

# Evaluation labels never enter calibration fitting.
evaluation:
  center_points: [[0.25, 0.25], [0.75, 0.25], [0.25, 0.75], [0.75, 0.75], [0.5, 0.34], [0.34, 0.5]]
  calibration_points: [[0.5, 0.5], [0.12, 0.12], [0.5, 0.12], [0.88, 0.12], [0.88, 0.5], [0.88, 0.88], [0.5, 0.88], [0.12, 0.88], [0.12, 0.5]]
  settle_ms: 650.0
  dwell_ms: 2200.0
  max_dwell_ms: 10000.0
  calibration_min_samples: 8

# M2 显示默认参数：候选 44；来源为 Mac 单用户、B 九点校准后 3 次全屏跳点任务，待多人验证。
# 优先响应速度；非盲测主观试用结论与限制见 验证记录.md。
filter:
  min_cutoff: 2.0  # Hz; x and y have independent filter state.
  beta: 0.05  # Units depend on full-screen normalized coordinates / second.
  d_cutoff: 1.0  # Hz
fixation:
  window_ms: 80.0
  angular_threshold_deg_s: 90.0  # 候选 44；Mac 单用户 3 次任务，待多人验证，非专业眼动仪标准。
  fallback_threshold_norm_s: 1.5  # Separate unit: normalized screen distance / second.
  min_duration_ms: 100.0
  max_gap_ms: 250.0
offline_filter:
  cutoff_hz: 3.0
  order: 2
  max_gap_ms: 250.0
display:
  max_pages: 16
  idle_timeout_s: 300.0

# M3a: no personal profiles; radii are visual settings, NOT measured accuracy.
overlay:
  presentation: false
  presentation_stroke_px: 6
  presentation_color: '#FFD166'
  presentation_label_font_px: 26
  calibration_notice_s: 3
  screen_debounce_ms: 300  # Coalesce projector topology signals; never query displays in the 16ms tick.
  screen_retry_count: 3    # Allow Qt/AppKit/Quartz topology snapshots to settle before reporting unavailable.
  radius_cm: 2.0  # Illustrative fallback only; M3b will use a matching B check.
  fallback_radius_px: 28.0  # Logical pixels if physical screen size is not measured.
  opacity: 0.65
  fade_ms: 200.0
  stale_ms: 300.0  # Age from OpenCV capture_ns; stale data cannot reappear.
  stroke_px: 2.0
  refresh_ms: 16
  idle_after_s: 3.0  # Continuous no_face before capture throttling.
  idle_fps: 5.0  # Requested software read rate, not a measured camera rate.
  color: '#35d6b4'
  label_font_px: 13
  label_inset_px: 40  # Top/side inset in logical pixels.
  label_position: bottom_center  # bottom_center / bottom_right / top_left
  label_bottom_inset_px: 90  # Distance from label bottom to full-screen bottom.
  label_padding_px: 12  # Horizontal padding on each side; logical pixels.
  label_autohide_s: 4.0  # Hold after startup/accepted notice, then fade_ms fade; 0 keeps visible.
  label_debounce_s: 1.0  # Transient status must persist; tracking recovery never restarts the hold.
  diagnostic_size_px: 12
  task_radius_px: 12  # Logical pixels, calibration/check target circle.
  profile_name: builtin  # Used only when there is no named device file.
  profile_poll_s: 1.0  # Detect replacement/deletion without blocking the Qt loop.
  tray_check_delay_ms: 500  # One final startup visibility check after Qt layout.
  web_url: http://127.0.0.1:8765
  panel_on_start: auto  # auto=always on macOS; elsewhere falls back if tray unavailable. always / never.
  calibration_redo_cm: 2.0  # Self-fit residual threshold, NOT independent B accuracy. Only measured screens.
  hotkeys:  # Native system registration only; Ctrl+Alt is Control+Option on Mac. Empty disables one.
    toggle: Ctrl+Alt+G
    pause: Ctrl+Alt+P
    calibrate: Ctrl+Alt+C
    panel: Ctrl+Alt+O
    heatmap_toggle: Ctrl+Alt+H
    heatmap_view: Ctrl+Alt+V
    demo: Ctrl+Alt+D
    demo_practice: Ctrl+Alt+R

# M5: offset only, no nine-point fine tuning. Sampling thresholds remain M4's.
autocal:
  enabled: false
  window_ms: [300, 0]  # Post-hoc correction to the one-sided rule; original decision retained in verification.
  max_fps: inference  # Inherit inference.max_fps (default 15); independent live verification pending.
  # max_fps: null=full speed; inference=inherit inference.max_fps; or positive FPS.
  min_clicks: 10
  max_clicks: 120  # 基于单次会话的暂定值，待实机独立核对。
  min_occupied_cells: 3
  frame_history_s: 2.0
  pending_timeout_s: 2.0
  queue_size: 256
  close_timeout_s: 5.0
  sampling_config: implicit_experiment.yaml

# M6: screen regions only, never content. All heatmap work is off the GUI thread.
heatmap:
  enabled: false
  allow_uncalibrated: false
  grid_width: 160  # Height follows the full logical screen aspect ratio.
  update_hz: 4.0  # Background idle/gap checks only; legacy setting, never a redraw rate.
  display_mode: on_demand  # Accumulate without drawing; continuous shows on enable.
  view_update_hz: 1.0  # Viewing rate for BOTH modes; no heatmap repaint while hidden.
  alpha_threshold: 0.15  # Below threshold: transparent; threshold..2*threshold: smoothstep alpha fade.
  render_scale: 0.5  # Interpolate FLOAT heat to half logical screen size before color/8-bit conversion.
  dither_strength: 0.5  # Alpha LSB peak-to-peak (0 disables); subtle initial choice, Mac visual check pending.
  half_life_s: 60.0
  max_opacity: 0.4  # Hard ceiling; the gaze ring is painted above the heatmap.
  queue_size: 256
  regions: null  # Default 3x3; or [{id: left, rect: [0, 0, 0.5, 1]}, ...], no overlaps.
  target_neighborhood_sigma: 1.0  # Target validation radius in multiples of the SAME sigma.

# M8: display coordinates only; calibration/evaluation continue using raw data.
demo:
  dwell_ms: 800
  show_gaze_ring: false  # Highlight the button rather than encourage chasing a noisy ring.
  leave_grace_ms: 150
  cooldown_ms: 800
  loss_reset_ms: 400
  hit_expand_ratio: 0.5  # 0 = off; only expands the accumulating button, not its drawing.
  practice: true
  practice_window_ms: 600  # Last valid capture-time window before practice trigger.
  practice_min_samples: 5
  practice_min_span_ms: 500  # Allow 15 Hz discrete sampling of the 600 ms window.
  practice_max_correction_cm: 3  # Only checked using measured screen dimensions.
  labels: ['我想喝水', '我不舒服', '请叫护士', '开灯', '是', '否']
  round_s: 60
  undo_ms: 1000
  feedback_ms: 2000
  flash_ms: 350
  speech_timeout_ms: 15000
  button_font_px: 48  # Logical pixels, >= 40. No DPR multiplication.
  heading_font_px: 36
  progress_px: 10
  min_button_px: 160  # Floor; each side is also >= 3 x corresponding error radius.
  padding_px: 32
  header_px: 120
  footer_px: 65
  background: '#101B30'
  button_color: '#EDF3FF'
  hole_color: '#294363'
  text_color: '#112444'
  progress_color: '#FFCA55'
  feedback_color: '#FFCA55'
  active_color: '#FFD475'
  debug_before_color: '#F47BA9'
  debug_after_color: '#68DBFF'
  debug_point_px: 5
  practice_target_px: 5

# M8 starfield: animation interpolation is visual only, never calibration data.
starfield:
  particle_count: 2000  # Includes a fixed reusable firework pool.
  firework_pool: 400
  firework_particles: 100
  animation_fps: 60
  frame_budget_ms: 8  # Median paintEvent target; real full-screen Mac measurement pending.
  long_frame_ms: 16.666666666666668
  round_s: 60
  replay_s: 5
  halo_radius_factor: 1.5
  stable_radius_factor: 1
  bloom_ms: 1500
  cooldown_ms: 1000
  stale_ms: 300
  max_capture_gap_ms: 300
  spring_hz: 3
  halo_fade_s: 0.25
  attraction_strength: 12
  return_strength: 5
  particle_drag: 4
  max_animation_step_s: 0.05
  base_brightness: 0.22
  brightness_gain: 0.75
  min_star_px: 1
  max_star_px: 3
  firework_life_s: 1.2
  firework_speed_px_s: 170
  firework_drag: 1
  firework_size_px: 3
  mask_columns: 160
  constellation_footprint_px: 12  # Union of star disks and line corridors, not bounding boxes.
  reveal_threshold: 0.7
  reveal_s: 1
  constellation_count: 4  # Supports 3–5 self-drawn patterns, no external images.
  color_palette: [[190, 215, 255], [255, 190, 140], [255, 155, 210], [150, 235, 255]]
