inference:
  device: auto  # auto / cpu / cuda; auto uses CUDA when available, otherwise CPU
  cpu_threads: 4
  max_faces: 1
  blink_threshold: 0.14
  distance_min_m: 0.15
  distance_max_m: 1.5
  normalized_camera_distance_m: 0.6
camera:
  index: 0
  width: 640
  height: 480
  backend: auto  # auto / dshow (DirectShow, Windows only)
  grayscale: false
  startup_timeout_s: 120.0
  stop_timeout_s: 5.0
geometry:
  width_cm: 30.2
  height_cm: 19.6
  top_cm: 0.2
  focal_scale: 1.0
