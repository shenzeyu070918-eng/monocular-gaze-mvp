device_file: null  # Relative to this config: devices/<设备名>.yaml; null uses estimated intrinsics.
inference:
  device: auto  # auto / cpu / cuda; auto uses CUDA when available, otherwise CPU
  cpu_threads: 4
  max_faces: 1
  blink_threshold: 0.14
  distance_min_m: 0.15
  distance_max_m: 1.5
  normalized_camera_distance_m: 0.6
camera:
  index: 0
  width: 640
  height: 480
  backend: auto  # auto / dshow (DirectShow, Windows only)
  grayscale: false
  startup_timeout_s: 120.0
  stop_timeout_s: 5.0
  warmup_timeout_s: 3.0  # Retry failed reads until the first frame, up to this deadline.
  read_retry_interval_s: 0.05  # Interruptible wait between failed reads; no delay on success.
  read_retry_count: 3  # After the first valid frame: extra attempts after a failed read.
  black_threshold: 2.0  # Mean brightness on 0–255 scale.
  black_frame_count: 10  # Consecutive dark frames after exposure warmup.
  undistort: true
  undistort_alpha: 0.0  # OpenCV new-camera-matrix alpha; no ROI crop is applied.
geometry:
  width_cm: null  # Fill both measured dimensions, or select a measured device file.
  height_cm: null
  measured: false
  horizontal_cm: 0.0  # Positive to the viewer's right of the screen centre.
  top_cm: 0.0  # Positive ABOVE the top of the visible screen.
  focal_scale: 1.0
recording:
  output_dir: data/sessions
  queue_size: 2048
  close_timeout_s: 10.0
  request_timeout_s: 15.0
jump:
  point_count: 20
  dwell_ms: 1500.0
  min_distance: 0.35
  margin: 0.05  # Fraction of each screen dimension; target centers stay inside this inset.
calibration:
  views: 20
  max_error_px: 1.0  # Acceptance threshold, not a measured result.
  min_view_distance: 0.08
  min_center_span: 0.2
  min_tilt_span_deg: 15.0
  refine_window_px: 11
  refine_max_iterations: 30
  refine_epsilon: 0.001
distance_check:
  distances_cm: [40, 50, 60]
  settle_ms: 1000.0
  duration_ms: 3000.0
  min_samples: 20
  warning_cm: 5.0  # Warning threshold, not a measured result.

# Evaluation labels never enter calibration fitting.
evaluation:
  center_points: [[0.25, 0.25], [0.75, 0.25], [0.25, 0.75], [0.75, 0.75], [0.5, 0.34], [0.34, 0.5]]
  calibration_points: [[0.5, 0.5], [0.12, 0.12], [0.5, 0.12], [0.88, 0.12], [0.88, 0.5], [0.88, 0.88], [0.5, 0.88], [0.12, 0.88], [0.12, 0.5]]
  settle_ms: 650.0
  dwell_ms: 2200.0
  max_dwell_ms: 10000.0
  calibration_min_samples: 8

# M2 provisional parameters. Real tuning and subjective validation are pending.
filter:
  min_cutoff: 1.0  # Hz; x and y have independent filter state.
  beta: 0.05  # Units depend on full-screen normalized coordinates / second.
  d_cutoff: 1.0  # Hz
fixation:
  window_ms: 80.0
  angular_threshold_deg_s: 90.0  # Provisional, not imported as an eye-tracker standard.
  fallback_threshold_norm_s: 1.5  # Separate unit: normalized screen distance / second.
  min_duration_ms: 100.0
  max_gap_ms: 250.0
offline_filter:
  cutoff_hz: 3.0
  order: 2
  max_gap_ms: 250.0
display:
  max_pages: 16
  idle_timeout_s: 300.0
