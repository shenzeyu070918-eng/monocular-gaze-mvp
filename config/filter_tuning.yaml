# Search space and measurement rules, NOT measured recommended parameters.
min_cutoff: [0.5, 1.0, 2.0]
beta: [0.0, 0.05, 0.2]
d_cutoff: [1.0, 2.0]
angular_threshold_deg_s: [45.0, 90.0, 180.0]
stable_settle_ms: 500.0
min_stable_frames: 5
response_window_ms: 600.0
crossing_hold_ms: 0.0  # First sampled crossing by default; no sub-frame interpolation.
# Minimum signal displacement / RMS of the two raw stable-window position SDs.
# Measurement exclusion rule (not an empirically tuned eye-tracker threshold).
min_signal_jump_snr: 3.0
min_valid_coverage: 0.8
min_angle_coverage: 0.8
min_fixation_coverage: 0.5
min_transition_coverage: 0.8
max_missed_rate: 0.3
max_false_detection_share: 0.3
min_tasks: 3
expected_points: 20
require_personal_calibration: true
