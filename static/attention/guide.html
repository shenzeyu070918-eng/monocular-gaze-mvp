<!doctype html><meta charset="utf-8"><title>M9 本地注意力引导 · 左侧主测试页</title>
<style>html,body{margin:0;background:#eef0f4;color:#172030;font:20px system-ui}#start{position:fixed;inset:12% 18%;background:white;padding:30px;z-index:5;overflow:auto}button{font-size:20px;padding:12px;margin:5px}.block{position:absolute;box-sizing:border-box;border:2px solid #567;padding:16px;background:white}.active{border:2px solid #cc6d18}.active>b{color:#a65d13}#hint{position:fixed;bottom:4px;left:20px;right:20px;background:#132233;color:white;padding:10px;z-index:4}#board{position:relative}#tail{background:#1e4460;color:white;padding:32px;display:none}.scroll-block{height:38vh;min-height:240px;border:4px solid #7cbed0;padding:20px;margin:20px;background:#28394e;font-size:50px}</style>
<div id="start">本地验收：自动采集30秒关闭分析的CPU基线。<p>准备有效九点；浏览器放在内置屏，100%缩放。动作每步4秒，总计默认36秒，提示也会显示在屏幕录制条上。</p><p id="preparation">先打开排除测试应用及 Finder 备用；本次选定的排除应用会临时加入名单，不修改配置。</p><button id="prepare">① 打开右侧彩色测试标签</button><p>看到第二页后，按 ⌘⇧[ 返回本页。切标签测试会用它。</p><button id="full">② 进入全屏</button><button id="begin" disabled>③ 开始引导</button><p id="status">基线采集中…</p></div><div id="board"></div><div id="tail"></div><div id="hint"></div>
<script type="module">
import {phaseAt,clockEstimate,instruction} from '/guide-logic.mjs';
const token=location.hash.slice(1);history.replaceState(null,'','/');const $=id=>document.getElementById(id);
let offset=0,last=0,begun=false,ended=false,inflight=false;
async function request(path,data){const r=await fetch(path,{method:data?'POST':'GET',headers:{'X-Attention-Token':token,...(data?{'Content-Type':'application/json'}:{})},...(data?{body:JSON.stringify(data)}:{})});const v=await r.json();if(!r.ok)throw Error(v.error||'本地连接失败');return v;}
function geometry(e){return {screenX:screenX,screenY:screenY,innerWidth,innerHeight,outerWidth,outerHeight,dpr:devicePixelRatio,screenWidth:screen.width,screenHeight:screen.height,fullscreen:Number(!!document.fullscreenElement),clientX:e.clientX,clientY:e.clientY,eventScreenX:e.screenX,eventScreenY:e.screenY,scale:visualViewport?.scale||1};}
$('prepare').onclick=()=>{const tab=window.open('/second#'+token,'m9-secondary');if(!tab)$('status').textContent='请允许本地测试页打开新标签，然后再点一次';};
$('full').onclick=()=>document.documentElement.requestFullscreen().catch(e=>$('status').textContent=e.message);
$('begin').onclick=async e=>{try{const layout=await request('/begin',geometry(e));begun=true;$('start').remove();window.scrollTo(0,0);$('board').style.height=innerHeight+'px';for(const r of layout.rects){const b=document.createElement('div');b.className='block';b.id='b'+r.id;const [x,y,w,h]=r.client_rect;b.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px`;b.innerHTML=`<b>${r.id} · 注意力测试块</b><p>看中央十字，不追视线圈</p><div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:28px">＋</div>`;$('board').append(b);}for(let n=9;n<=16;n++){const b=document.createElement('div');b.className='scroll-block';b.textContent=`${n} · 滚动验证内容`;b.style.background=n%2?'#163f5e':'#563447';$('tail').append(b);}$('tail').style.display='block';}catch(e){$('status').textContent=e.message;}};
async function poll(){if(inflight||ended)return;inflight=true;try{
  await request('/observe',{page:'primary',visible:document.visibilityState==='visible',scroll_fraction:Math.min(100,Math.abs(scrollY)/innerHeight)});
  const a=performance.now(),state=await request('/clock'),b=performance.now();offset=clockEstimate([{before:a,after:b,serverNs:state.time_ns}]).offsetNs;
  if(!begun){$('preparation').textContent=`先打开「${state.excluded_app}」及 Finder 备用；排除名单仅本次临时修改。`;$('begin').disabled=!state.baseline_ready||!state.second_ready;$('status').textContent=`${state.baseline_ready?'CPU基线完成':'基线自动采集中（30秒）'}；${state.second_ready?'第二标签已准备':'请先准备右侧标签'}。排除测试：${state.excluded_app}（仅本次临时加入名单）。`;return;}
  if(state.elapsed_s===null){$('hint').textContent=state.wait_reason||'正在准备首个稳定画面，系统弹窗处理完后才开始计时';return;}
  const stage=phaseAt(state.elapsed_s,state.action_s);
  if(stage.kind==='target'){if(stage.id!==last&&document.visibilityState==='visible'){last=stage.id;document.querySelectorAll('.active').forEach(e=>e.classList.remove('active'));$('b'+last).classList.add('active');requestAnimationFrame(()=>request('/event',{kind:'target',time_ns:Math.round(performance.now()*1e6+offset),id:last}).catch(e=>$('hint').textContent=e.message));}$('hint').textContent=`看第${stage.id}块中央 · ${state.elapsed_s.toFixed(1)} / ${state.duration_s}s`;}
  else if(stage.kind==='phase')$('hint').textContent=instruction(stage.phase,state.excluded_app,state.pause_key)+` · ${state.elapsed_s.toFixed(1)}s`;
  if(state.finished){ended=true;$('hint').textContent='引导结束，正在本机整理；控制面板将显示四项标准和未执行步骤。';}
}catch(e){if($('status'))$('status').textContent=e.message;else $('hint').textContent=e.message;}finally{inflight=false;}}
setInterval(poll,250);poll();
</script>
