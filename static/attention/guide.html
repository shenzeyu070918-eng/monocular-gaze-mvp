<!doctype html><meta charset="utf-8"><title>M9 本地30秒引导</title>
<style>html,body{margin:0;background:#eef0f4;color:#172030;font:20px system-ui}#start{position:fixed;inset:30%;background:white;padding:30px;z-index:5}button{font-size:22px;padding:15px}.block{position:absolute;box-sizing:border-box;border:2px solid #567;padding:16px;background:white}.active{border:2px solid #cc6d18}.active>b{color:#a65d13}#hint{position:fixed;bottom:4px;left:20px;background:#132233;color:white;padding:8px;z-index:4}#board{position:absolute;inset:0;overflow:hidden}#clock{font-size:14px}</style>
<div id="start">本地验收：先自动采集30秒关闭分析时的CPU基线。<p>请先准备有效九点，把浏览器移到内置屏、保持100%缩放。</p><button id="full">进入全屏</button><button id="begin" disabled>开始30秒</button><p id="status">基线采集中…</p></div><div id="board"></div><div id="hint"></div>
<script type="module">
import {phaseAt,clockEstimate} from "/guide-logic.mjs";
const token=location.hash.slice(1);history.replaceState(null,'','/');let offset=0,layout=null,start=0,stage=-1,last=-1,ended=false;
const $=id=>document.getElementById(id);
async function request(path,data){const r=await fetch(path,{method:data?'POST':'GET',headers:{'X-Attention-Token':token,...(data?{'Content-Type':'application/json'}:{})},...(data?{body:JSON.stringify(data)}:{})});const v=await r.json();if(!r.ok)throw Error(v.error||'本地连接失败');return v;}
async function clock(){const samples=[];let ready=false;for(let i=0;i<5;i++){const a=performance.now(),v=await request('/clock'),b=performance.now();samples.push({before:a,after:b,serverNs:v.time_ns});ready=v.baseline_ready;}offset=clockEstimate(samples).offsetNs;return ready;}
const poll=setInterval(async()=>{try{const ready=await clock();$('begin').disabled=!ready;$('status').textContent=ready?'基线完成。全屏后点击开始。':'基线自动采集中，不需要注视。';}catch(e){$('status').textContent=e.message;}},1000);
$('full').onclick=()=>document.documentElement.requestFullscreen();
function geometry(e){return {screenX:window.screenX,screenY:window.screenY,innerWidth,innerHeight,outerWidth,outerHeight,dpr:devicePixelRatio,screenWidth:screen.width,screenHeight:screen.height,fullscreen:Number(!!document.fullscreenElement),clientX:e.clientX,clientY:e.clientY,eventScreenX:e.screenX,eventScreenY:e.screenY,scale:window.visualViewport?.scale||1};}
function event(kind,data={}){return request('/event',{kind,time_ns:Math.round(performance.now()*1e6+offset),...data}).catch(e=>$('hint').textContent=e.message);}
$('begin').onclick=async e=>{try{await clock();layout=await request('/begin',geometry(e));clearInterval(poll);$('start').remove();for(const r of layout.rects){const b=document.createElement('div');b.className='block';b.id='b'+r.id;const [x,y,w,h]=r.client_rect;b.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px`;b.innerHTML=`<b>${r.id} · 注意力测试块</b><p>看中央的十字，不追视线圈</p><div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:28px">＋</div>`;$('board').append(b);}start=performance.now();setInterval(tick,50);}catch(error){$('status').textContent=error.message;}};
function tick(){if(ended)return;const t=(performance.now()-start)/1000;if(t<16){const n=phaseAt(t).id;if(n!==last){last=n;document.querySelectorAll('.active').forEach(b=>b.classList.remove('active'));$('b'+n).classList.add('active');requestAnimationFrame(()=>event('target',{id:n}));}$('hint').textContent=`看第${n}块中央 · ${t.toFixed(1)}s / 30s`;return;}
const phases=[['scroll',16,'滚动一次（滚轮/触控板），停住2秒'],['tab',18,'切到另一标签页停2秒，再返回'],['app',20,'切到另一普通应用停2秒，再返回'],['exclude',22,'进入排除应用约2秒并返回'],['pause',26,'按 Control+Option+S 暂停，再按一次恢复']];let i=0;for(let j=0;j<phases.length;j++)if(t>=phases[j][1])i=j;if(i!==stage){stage=i;event('phase',{phase:phases[i][0]});if(i===0){$('board').style.overflow='auto';$('board').style.height='1400px';document.body.style.height='1600px';}}$('hint').textContent=phases[i][2]+` · ${t.toFixed(1)}s`;
if(t>=30){ended=true;event('end');$('hint').textContent='30秒结束，正在本地整理。请回控制面板查看目录；实际动作未执行的步骤须标为未完成。';}}
</script>
